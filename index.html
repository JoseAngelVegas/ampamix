<style>

@keyframes movimientoPrincipal {
  0% { width: 150px; height: 150px; }
  50% { width: 148px; height: 148px; }
  100% { width: 150px; height: 150px; }
}


@keyframes iconoEspacioAudio {
  0% {  filter: blur(0px); top: 0px; width: 150px; height: 150px; }
  100% { filter: blur(10px); top: 400px; width: 50px; height: 50px; }
 
}

@keyframes iconoEspacioTexto {
  0% {  filter: blur(0px); top: 0px; }
  100% { filter: blur(10px); top: 250px; }
 
}

@keyframes iconoEspacioVideo {
  0% {  filter: blur(0px); top: 0px; }
  100% { filter: blur(10px); top: 140px; }
 
}

@keyframes iconoAnimacion {
  0% {  top: -10px; width: 0px; height: 0px; }
  100% { top: -220px; width: 120px; height: 120px; }
}

@keyframes trofeo {
  0% { top: -10px; width: 0px; height: 0px; }
  100% { top: -300px; width: 50px; height: 50px; }
}

@keyframes animacionPantalla {
  0% { top: 0px; width: 0%; height: 0%; }
  100% {top: 0px; width: 100%; height: 100%; }
}

@keyframes mas {
  0% { box-shadow: 0px 0px 0px white; top: -10px; width: 0px; height: 0px; }
  100% { box-shadow: 0px 0px 20px white; top: 0px; width: 100px; height: 100px; }
}

    @keyframes animacionDeCerrar {
  0% { top: 0px; width: 0px; height: 0px; }
  100% { top: 0px; width: 80px; height: 35px; }
}

  @keyframes volverInterfaz {
  0% { filter: blur(10px); opacity: 0%; top: 300px; width: 80px; height: 80px; }
   100% {   filter: blur(0px); opacity: 100%; top: 0px; width: 150px; height: 150px; }
}

@keyframes volverAnimacionPantalla {
  0% {top: 0px; width: 100%; height: 100%; }
    100% { top: 0px; width: 0%; height: 0%; }
}


@keyframes animacionIconoVolver {
  0% { top: 0px; width: 120px; height: 120px; }
  100% { top: 100px; width: 0px; height: 0px; }
  

@keyframes animacionTrofeoCerrar {
  0% { top: -300px; width: 50px; height: 50px; }
  100% { top: -10px; width: 0px; height: 0px; }
}


@keyframes animacionMasCerrar {
  0% { top: -100px; width: 120px; height: 120px; }
  100% { top: -10px; width: 0px; height: 0px; }
}

}

@keyframes animacionBotonCerrar {
  0% { top: 0px; width: 80px; height: 35px; }
  100% { top: 0px; width: 0px; height: 0px; }
}

@keyframes cerrar {
  0% {  filter: blur(0px); opacity: 100%; top: 0px; width: 150px; height: 150px; }
  100% { filter: blur(10px); opacity: 0%; top: 0px; width: 80px; height: 80px; }
 
}


</style>
